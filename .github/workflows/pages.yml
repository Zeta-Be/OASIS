# Publica app/ en GitHub Pages en cada push a main.
# El sitio queda en https://zetabe.agency/OASIS/ (subcarpeta /OASIS/; la dirección
# anterior, https://zeta-be.github.io/OASIS/, redirige sola a esta):
# todas las rutas dentro de app/ son relativas, nunca desde la raíz.
# Requiere una vez: Settings → Pages → Source: «GitHub Actions».

name: Publicar app en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; la que está en curso termina antes de empezar la siguiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v5
